<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savant Spotlight · Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ss.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { --ui: #0b1f36; --ui2: #12304f; --ui3: #1d4570; --line: rgba(246,241,229,.14); --txt: #f6f1e5; --dim: #a9b6c4;
    background: var(--ui); color: var(--txt); font: 500 16px/1.3 var(--cond); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--ui3); border: 0; border-bottom: 3px solid rgba(0,0,0,.25); border-radius: 2px; padding: 6px 12px 5px; cursor: pointer; white-space: nowrap;
    font: 600 15px/1.1 var(--head); text-transform: uppercase; letter-spacing: .02em; }
  button:hover { background: #275a8f; }
  button.act { background: var(--gold); color: var(--ink); }
  input[type=text], input[type=number], select { background: #fff; color: var(--ink); border: 0; border-radius: 2px; padding: 6px 8px; font-weight: 600; }
  input[type=number] { width: 66px; }
  label { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); }
  .k { font: 600 13px var(--cond); letter-spacing: .1em; color: var(--tan); text-transform: uppercase; }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--navy); border-bottom: 5px solid var(--gold); flex-wrap: wrap; }
  header h1 { margin: 0 10px 0 0; font: 700 28px/1 var(--head); text-transform: uppercase; }
  header h1 b { color: var(--gold); }
  .grow { flex: 1; }
  .status { font: 600 14px var(--cond); color: var(--dim); }
  .status.ok { color: #7ed99d; } .status.bad { color: #ff8a8d; }
  #airBtn { min-width: 120px; }
  #airBtn.live { background: var(--red); }

  main { display: grid; grid-template-columns: 340px 1fr; min-height: 0; }
  #pool { display: flex; flex-direction: column; min-height: 0; background: var(--ui2); }
  .pool-top { padding: 10px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .filters { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .filters button { padding: 4px 10px 3px; font-size: 13px; }
  #list { overflow-y: auto; flex: 1; padding: 4px 6px; }
  .row { display: grid; grid-template-columns: 46px 1fr auto; gap: 8px; align-items: center; padding: 6px; cursor: pointer; user-select: none;
    border-left: 4px solid transparent; border-bottom: 1px solid var(--line); }
  .row:hover { background: rgba(246,241,229,.06); }
  .row.sel { border-left-color: var(--gold); background: rgba(233,185,73,.12); }
  .row .hs { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; background: var(--tc); border: 2px solid var(--paper); }
  .row .hs img { width: 100%; height: 120%; object-fit: cover; object-position: 50% 0; }
  .row .n { font: 600 18px/1 var(--head); text-transform: uppercase; }
  .row .m { font: 500 14px var(--cond); color: var(--dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .fa { color: #ff8a8d; font-weight: 700; }
  .row .cc { font: 700 12px/1 var(--cond); letter-spacing: .06em; color: var(--dim); text-align: right; }
  .row .cc b { display: block; font: 600 18px/1 var(--head); color: var(--gold); }
  .sect { font: 700 13px var(--cond); letter-spacing: .12em; color: var(--tan); padding: 12px 6px 4px; }
  .more { padding: 10px 6px; color: var(--dim); font-size: 14px; }

  #centre { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 12px; gap: 10px; overflow-y: auto; }
  #preview { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #000; outline: 1px solid var(--line); flex: none; }
  #preview .stage.off .panel { opacity: .35; transform: none; }
  .offtag { position: absolute; right: 10px; top: 10px; font: 700 14px var(--head); background: var(--red); padding: 4px 8px; display: none; z-index: 3; }
  body.offair .offtag { display: block; }
  .guides { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
  body.noguides .guides { display: none; }
  .guides .mask { position: absolute; background: rgba(120,85,40,.55); }
  .guides .cam { position: absolute; background: rgba(15,39,66,.72); border: 6px solid #fff; display: grid; place-items: center;
    font: 700 64px var(--head); color: rgba(246,241,229,.7); text-transform: uppercase; }
  .guides .safe { position: absolute; border: 4px dashed #2fbf71; }

  #insp { display: flex; flex-direction: column; gap: 10px; background: var(--ui2); padding: 12px 14px; border-top: 4px solid var(--gold); }
  .bar { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; }
  .bar + .bar { padding-top: 10px; border-top: 1px solid var(--line); }
  #views { display: flex; gap: 6px; flex-wrap: wrap; }
  #views button { padding: 10px 14px 8px; font-size: 17px; }
  #views button small { font: 700 11px var(--cond); opacity: .6; margin-right: 6px; }
  .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
  .who .n { font: 700 24px/1 var(--head); text-transform: uppercase; }
  .who .m { font: 500 15px var(--cond); color: var(--dim); margin-top: 3px; }
  .help { font: 500 14px var(--cond); color: var(--dim); }
  .opt[hidden], .cmp[hidden] { display: none !important; }
  .cmp { display: inline-flex; gap: 4px; }
  .cmp button { max-width: 210px; overflow: hidden; text-overflow: ellipsis; }
  .cmp button.act { background: var(--gold); color: var(--ink); }
  .row.sel2 { border-left-color: #2f8fd8; background: rgba(47,143,216,.14); }
  .row .slot { font: 700 12px var(--head); padding: 1px 5px; margin-left: 6px; background: var(--gold); color: var(--ink); }
  .row.sel2 .slot { background: #2f8fd8; color: #fff; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(11,31,54,.85); font: 700 28px var(--head); color: var(--gold); z-index: 50; text-transform: uppercase; }
</style>
</head>
<body>
<header>
  <h1><b>SAVANT</b> SPOTLIGHT</h1>
  <button id="airBtn" title="Fade the graphic in / out on the display (A)">OFF AIR</button>
  <span class="grow"></span>
  <span class="k">room</span><input type="text" id="room" style="width:150px">
  <button id="copyUrl">Copy OBS URL</button>
  <button id="openOut">Open display</button>
  <span class="status" id="net">not sent</span>
</header>
<main>
  <section id="pool">
    <div class="pool-top">
      <input type="text" id="q" placeholder="Search any player (/)">
      <div class="filters" id="scope"></div>
      <div class="filters" id="roleF"></div>
      <div class="filters">
        <select id="teamF" style="flex:1"></select>
        <select id="sort"><option value="pt">Most playing time</option><option value="card">Fullest Savant card</option><option value="name">Name</option></select>
      </div>
    </div>
    <div id="list"></div>
  </section>
  <section id="centre">
    <div id="preview"><div class="offtag">OFF AIR</div></div>
    <div id="insp">
      <div class="bar">
        <div class="who" id="who"><span class="help">Pick a player from the list.</span></div>
        <span class="grow"></span>
        <label><input type="checkbox" id="compare"> Compare</label>
        <span class="cmp" id="cmpBox"><button id="slotA"></button><button id="slotB"></button><button id="swap" title="Swap A and B">⇄</button></span>
        <label class="opt" id="roleWrap">Show as <select id="role"><option value="pit">Pitcher</option><option value="bat">Hitter</option></select></label>
        <label>Season <select id="year"></select></label>
      </div>
      <div class="bar">
        <span class="k">graphic</span>
        <div id="views"></div>
      </div>
      <div class="bar" id="optsBar">
        <span class="k">filters</span>
        <label class="opt" id="o-side">Opponent <select id="side"><option value="all">Everyone</option><option value="L">Lefties</option><option value="R">Righties</option></select></label>
        <label class="opt" id="o-loc">Pitches <select id="loc"></select></label>
        <label class="opt" id="o-spray">Batted balls <select id="spray"></select></label>
        <label class="opt" id="o-zm">Zone stat <select id="zm"></select></label>
        <label class="opt" id="o-stat">Show <select id="stat"><option value="season">Season</option><option value="career">Career</option><option value="years">Season by season</option></select></label>
        <label class="opt" id="o-rot"><input type="checkbox" id="rot"> Auto-rotate season ↔ career every <select id="rotSecs"><option value="10">10</option><option value="12">12</option><option value="15">15</option></select> sec</label>
        <label class="opt" id="o-roty"><input type="checkbox" id="rotYears"> include season by season</label>
        <span class="help" id="noOpts">No filters for this graphic.</span>
      </div>
      <div class="bar">
        <label><input type="checkbox" id="lines"> Stat lines (season + career)</label>
        <label>Background <select id="bg"><option value="paper">Paper</option><option value="clear">Transparent</option></select></label>
        <span class="grow"></span>
        <span class="help">Keys: 1–8 pick a graphic · A on/off air · / search</span>
      </div>
      <div class="bar">
        <span class="k">safe area (stays clear of the host cams)</span>
        <label>Left <input type="number" id="safeL" step="5"></label>
        <label>Right <input type="number" id="safeR" step="5"></label>
        <label>Top <input type="number" id="safeT" step="5"></label>
        <label>Bottom <input type="number" id="safeB" step="5"></label>
        <button id="safeReset">Reset</button>
        <label><input type="checkbox" id="guides"> Show cam boxes in preview</label>
      </div>
    </div>
  </section>
</main>
<div id="loading">LOADING…</div>
<script src="ss.js"></script>
<script>
'use strict';
(() => {
  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const HUB = SS.hubOf(params);
  const STORE = 'ss-control-v1';

  // ── state ──
  const DEF = { room: 'tb-savant-' + Math.random().toString(36).slice(2, 7), on: false, id: null, role: 'pit', view: 'overview', year: 'auto', yearUsed: SS.SEASON,
    opts: { side: 'all', loc: 'all', spray: 'all', zm: 'xwoba', stat: 'season' }, compare: false, id2: null, role2: 'pit', year2Used: SS.SEASON, slot: 'A',
    rot: { on: false, secs: 12, years: false, t0: 0 }, lines: true, bg: 'paper', safe: Object.assign({}, SS.SAFE_DEFAULT), guides: true,
    pool: { scope: 'all', role: 'pit', team: '', sort: 'pt' } };
  let S;
  try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch { S = Object.assign({}, DEF); }
  S.opts = Object.assign({}, DEF.opts, S.opts); S.rot = Object.assign({}, DEF.rot, S.rot); S.pool = Object.assign({}, DEF.pool, S.pool); S.safe = Object.assign({}, DEF.safe, S.safe);
  if (params.get('room')) S.room = params.get('room');
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch {} };

  // ── stage preview ──
  const stage = SS.createStage($('preview'));
  const fit = () => { stage.el.style.transform = `scale(${$('preview').clientWidth / 1920})`; };
  new ResizeObserver(fit).observe($('preview'));
  fit();
  // show frame + camera boxes, drawn over the preview only (never sent to the display)
  const guides = document.createElement('div');
  guides.className = 'guides';
  stage.el.appendChild(guides);
  function drawGuides() {
    const s = S.safe, C = SS.CAMS, v = C.video, h = C.bottom - C.top;
    const box = (cls, x, y, w, hh, t = '') => `<div class="${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${hh}px">${t}</div>`;
    guides.innerHTML =
      box('mask', 0, 0, 1920, v.t) + box('mask', 0, v.b, 1920, 1080 - v.b) + box('mask', 0, v.t, v.l, v.b - v.t) + box('mask', v.r, v.t, 1920 - v.r, v.b - v.t) +
      box('cam', 10, C.top, Math.max(60, s.l - 18), h, 'Trev') + box('cam', s.r + 8, C.top, Math.max(60, 1910 - s.r - 8), h, 'Jake') +
      box('safe', s.l, s.t, s.r - s.l, s.b - s.t);
  }

  const net = (t, c) => { $('net').textContent = t; $('net').className = 'status ' + c; };
  const send = SS.publisher(HUB, () => S.room, net);
  const wire = () => ({ app: 'ss', seq: Date.now(), on: S.on, id: S.id, role: S.role, view: S.view, year: S.yearUsed, opts: S.opts, lines: S.lines, bg: S.bg, safe: S.safe,
    compare: S.compare && !!S.id2, id2: S.id2, role2: S.role2, year2: S.year2Used, rot: S.rot });
  let pubT = 0;
  function commit() {
    save(); draw();
    clearTimeout(pubT);
    pubT = setTimeout(() => send(wire()), 0);
  }

  // ── season: "auto" uses this year unless he barely played, then last year ──
  async function yearFor(id, role) {
    if (S.year !== 'auto') return +S.year;
    if (!id) return SS.SEASON;
    const [now, prev] = await Promise.all([SS.league(SS.SEASON), SS.league(SS.SEASON - 1)].map(p => p.catch(() => null)));
    const a = now ? SS.cardCount(now, role, id) : 0, b = prev ? SS.cardCount(prev, role, id) : 0;
    const used = now?.[role][id]?.val, pt = role === 'pit' ? parseFloat(used?.p_formatted_ip || 0) : (used?.pa || 0);
    return a < 5 && b > a && pt < (role === 'pit' ? 25 : 100) ? SS.SEASON - 1 : SS.SEASON;
  }
  async function resolveYear() {
    [S.yearUsed, S.year2Used] = await Promise.all([yearFor(S.id, S.role), yearFor(S.id2, S.role2)]);
  }

  // ── pool ──
  const P = id => SS.DB.players[id];
  const lg = () => SS.league(SS.SEASON);
  let L0 = null;
  // a two-way player browses as a pitcher under the Pitchers filter
  const roleFor = p => p.two && S.pool.role === 'pit' ? 'pit' : p.role;
  const ptOf = p => { const r = roleFor(p), v = L0?.[r]?.[p.id]?.val; return r === 'pit' ? parseFloat(v?.p_formatted_ip || 0) : (v?.pa || 0); };
  const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function quick(p) {
    const r = roleFor(p), v = L0?.[r]?.[p.id]?.val;
    if (!v) return 'no ' + SS.SEASON + ' Statcast';
    if (r === 'pit') return `${v.p_era != null ? (+v.p_era).toFixed(2) + ' ERA' : ''} · ${v.p_formatted_ip || 0} IP`;
    return `${v.pa || 0} PA · ${v.xwoba != null ? (+v.xwoba).toFixed(3).replace(/^0/, '') + ' xwOBA' : ''}`;
  }
  function rowHTML(p) {
    const t = SS.team(p.fa ? (p.fa.to || p.fa.from) : p.teamId);
    const where = p.fa ? `<span class="fa">${p.fa.to ? 'SIGNED ' + (SS.team(p.fa.to)?.abbr || '') : 'FA'}</span>${!p.fa.to && t ? ' · ex-' + t.abbr : ''}` : (t ? t.abbr : '—');
    const cc = L0 ? SS.cardCount(L0, roleFor(p), p.id) : 0;
    const slot = p.id === S.id ? 'A' : S.compare && p.id === S.id2 ? 'B' : '';
    return `<div class="row${slot === 'A' ? ' sel' : slot === 'B' ? ' sel2' : ''}" data-id="${p.id}"><div class="hs" style="--tc:${t?.color || '#2a3b4c'}"><img loading="lazy" src="${SS.headshot(p.id, 120)}" alt=""></div>` +
      `<div><div class="n">${SS.esc(p.name)}${S.compare && slot ? `<span class="slot">${slot}</span>` : ''}</div><div class="m">${roleFor(p) === 'pit' ? (p.throws || '') + 'HP' : SS.esc(p.pos)} · ${where} · ${SS.esc(quick(p))}</div></div>` +
      `<div class="cc"><b>${cc || '–'}</b>CARD</div></div>`;
  }
  let remote = [], remoteQ = '', rT = 0;
  function drawList() {
    const q = norm($('q').value.trim()), f = S.pool;
    let list = Object.values(SS.DB.players).filter(p => p.name);
    // a typed name searches everybody; the buttons only shape the browse list
    if (q) list = list.filter(p => norm(p.name).includes(q));
    else {
      if (f.scope === 'fa') list = list.filter(p => p.fa);
      if (f.role !== 'all') list = list.filter(p => p.role === f.role || (p.two && f.role === 'pit'));
      if (f.team) list = list.filter(p => String(p.fa ? (p.fa.to || p.fa.from) : p.teamId) === f.team);
    }
    const sorters = { pt: (a, b) => ptOf(b) - ptOf(a), card: (a, b) => (SS.cardCount(L0, roleFor(b), b.id) - SS.cardCount(L0, roleFor(a), a.id)) || ptOf(b) - ptOf(a), name: (a, b) => a.name.localeCompare(b.name) };
    if (L0 || f.sort === 'name') list.sort(sorters[f.sort] || sorters.pt);
    const CAP = 250;
    let h = list.slice(0, CAP).map(rowHTML).join('');
    if (list.length > CAP) h += `<div class="more">${list.length - CAP} more — search or filter to narrow it down</div>`;
    if (!list.length) h += `<div class="more">Nobody here${q ? ' by that name' : ''}.</div>`;
    const extra = remote.filter(p => !list.includes(p));
    if (q && extra.length) h += `<div class="sect">MORE PLAYERS (ANY SEASON)</div>` + extra.map(rowHTML).join('');
    $('list').innerHTML = h;
  }
  $('list').onclick = e => { const r = e.target.closest('.row'); if (r) pick(+r.dataset.id); };
  $('q').addEventListener('input', () => {
    drawList();
    const q = $('q').value.trim();
    clearTimeout(rT);
    if (q.length < 3) { remote = []; return; }
    rT = setTimeout(async () => { remoteQ = q; const r = await SS.search(q); if (remoteQ === q) { remote = r; drawList(); } }, 350);
  });
  function filterButtons(host, items, key) {
    host.innerHTML = items.map(([v, t]) => `<button data-v="${v}" class="${S.pool[key] === v ? 'act' : ''}">${t}</button>`).join('');
    host.onclick = e => { const b = e.target.closest('button'); if (!b) return; S.pool[key] = b.dataset.v; save(); filterButtons(host, items, key); drawList(); };
  }
  filterButtons($('scope'), [['all', 'All MLB'], ['fa', 'Free agents']], 'scope');
  filterButtons($('roleF'), [['pit', 'Pitchers'], ['bat', 'Hitters'], ['all', 'Everyone']], 'role');
  $('teamF').innerHTML = '<option value="">All teams</option>' + Object.entries(SS.TEAMS).sort((a, b) => a[1][2].localeCompare(b[1][2])).map(([id, t]) => `<option value="${id}">${t[2]}</option>`).join('');
  $('teamF').value = S.pool.team; $('teamF').onchange = () => { S.pool.team = $('teamF').value; save(); drawList(); };
  $('sort').value = S.pool.sort; $('sort').onchange = () => { S.pool.sort = $('sort').value; save(); drawList(); };

  async function pick(id) {
    const p = P(id) || await SS.ensure(id);
    if (!p) return;
    if (S.compare && S.slot === 'B' && S.id) {
      if (id === S.id) return;
      S.id2 = id; S.role2 = roleFor(p);
    } else {
      S.id = id; S.role = roleFor(p);
      if (S.id2 === id) S.id2 = null;
      if (S.compare && !S.id2) S.slot = 'B';
    }
    if (!SS.VIEWS[S.role].some(v => v.key === S.view)) S.view = 'overview';
    await resolveYear();
    commit(); drawList();
  }

  // ── inspector ──
  function draw() {
    document.body.classList.toggle('offair', !S.on);
    document.body.classList.toggle('noguides', !S.guides);
    $('airBtn').textContent = S.on ? 'ON AIR' : 'OFF AIR';
    $('airBtn').classList.toggle('live', S.on);
    const p = S.id && P(S.id);
    $('who').innerHTML = p ? `<div><div class="n">${SS.esc(p.name)}</div><div class="m">${S.role === 'pit' ? 'Pitcher' : 'Hitter'} · showing ${S.yearUsed}${S.year === 'auto' && S.yearUsed !== SS.SEASON ? ' (auto: not enough ' + SS.SEASON + ' data)' : ''}</div></div>`
      : '<span class="help">Pick a player from the list.</span>';
    const p2 = S.compare && S.id2 && P(S.id2);
    $('cmpBox').hidden = !S.compare; $('compare').checked = S.compare;
    $('slotA').textContent = 'A: ' + (p ? p.name : 'pick a player'); $('slotB').textContent = 'B: ' + (p2 ? p2.name : 'pick a player');
    $('slotA').classList.toggle('act', S.slot !== 'B'); $('slotB').classList.toggle('act', S.slot === 'B');
    if (p2) $('who').innerHTML += `<div class="m" style="margin-left:14px">vs <b style="color:var(--txt)">${SS.esc(p2.name)}</b> · ${S.year2Used}</div>`;
    $('roleWrap').hidden = !(p && p.two);
    $('role').value = S.role;
    const views = SS.VIEWS[S.role];
    $('views').innerHTML = views.map((v, i) => `<button data-v="${v.key}" class="${v.key === S.view ? 'act' : ''}"><small>${i + 1}</small>${v.name}</button>`).join('');
    const v = SS.viewOf(S.role, S.view);
    $('o-side').hidden = !v.side; $('o-loc').hidden = !v.loc; $('o-spray').hidden = !v.spray; $('o-zm').hidden = !v.zm;
    $('o-stat').hidden = !v.career; $('o-rot').hidden = !v.career; $('o-roty').hidden = !(v.career && S.rot.on);
    $('stat').value = S.opts.stat; $('stat').disabled = S.rot.on;
    $('rot').checked = S.rot.on; $('rotSecs').value = String(S.rot.secs); $('rotYears').checked = S.rot.years;
    $('noOpts').hidden = !!(v.side || v.loc || v.spray || v.zm || v.career);
    $('side').options[1].text = S.role === 'pit' ? 'Left-handed hitters' : 'Left-handed pitchers';
    $('side').options[2].text = S.role === 'pit' ? 'Right-handed hitters' : 'Right-handed pitchers';
    for (const k of ['side', 'loc', 'spray', 'zm']) $(k).value = S.opts[k];
    $('year').value = String(S.year);
    $('lines').checked = S.lines; $('bg').value = S.bg; $('guides').checked = S.guides;
    for (const [k, id] of [['l', 'safeL'], ['r', 'safeR'], ['t', 'safeT'], ['b', 'safeB']]) $(id).value = S.safe[k];
    drawGuides();
    stage.render(Object.assign(wire(), { on: true }));
  }
  const setView = k => { if (k === 'stats' && S.view !== 'stats') S.rot.t0 = Date.now(); S.view = k; commit(); };
  $('views').onclick = e => { const b = e.target.closest('button'); if (b) setView(b.dataset.v); };
  $('stat').onchange = () => { S.opts.stat = $('stat').value; commit(); };
  $('rot').onchange = () => { S.rot.on = $('rot').checked; S.rot.t0 = Date.now(); commit(); };
  $('rotSecs').onchange = () => { S.rot.secs = +$('rotSecs').value; S.rot.t0 = Date.now(); commit(); };
  $('rotYears').onchange = () => { S.rot.years = $('rotYears').checked; S.rot.t0 = Date.now(); commit(); };
  $('compare').onchange = () => { S.compare = $('compare').checked; S.slot = S.compare && S.id && !S.id2 ? 'B' : 'A'; commit(); drawList(); };
  $('slotA').onclick = () => { S.slot = 'A'; draw(); };
  $('slotB').onclick = () => { S.slot = 'B'; draw(); };
  $('swap').onclick = async () => { if (!S.id2) return; [S.id, S.id2, S.role, S.role2] = [S.id2, S.id, S.role2, S.role]; await resolveYear(); commit(); drawList(); };
  $('loc').innerHTML = Object.entries(SS.LOC_FILTER).map(([k, f]) => `<option value="${k}">${f.lab.toLowerCase()}</option>`).join('');
  $('spray').innerHTML = Object.entries(SS.SPRAY_FILTER).map(([k, f]) => `<option value="${k}">${f.lab.toLowerCase()}</option>`).join('');
  $('zm').innerHTML = Object.entries(SS.ZONE_METRIC).map(([k, f]) => `<option value="${k}">${f.lab}</option>`).join('');
  for (const k of ['side', 'loc', 'spray', 'zm']) $(k).onchange = () => { S.opts[k] = $(k).value; commit(); };
  $('year').innerHTML = '<option value="auto">Auto</option>' + Array.from({ length: SS.SEASON - SS.FIRST_YEAR + 1 }, (_, i) => SS.SEASON - i).map(y => `<option value="${y}">${y}</option>`).join('');
  $('year').onchange = async () => { S.year = $('year').value === 'auto' ? 'auto' : +$('year').value; await resolveYear(); commit(); };
  $('role').onchange = () => { S.role = $('role').value; if (!SS.VIEWS[S.role].some(v => v.key === S.view)) S.view = 'overview'; resolveYear().then(commit); };
  $('lines').onchange = () => { S.lines = $('lines').checked; commit(); };
  $('bg').onchange = () => { S.bg = $('bg').value; commit(); };
  $('airBtn').onclick = () => { S.on = !S.on; commit(); };
  for (const [k, id] of [['l', 'safeL'], ['r', 'safeR'], ['t', 'safeT'], ['b', 'safeB']]) $(id).onchange = () => { S.safe[k] = +$(id).value || SS.SAFE_DEFAULT[k]; commit(); };
  $('safeReset').onclick = () => { S.safe = Object.assign({}, SS.SAFE_DEFAULT); commit(); };
  $('guides').onchange = () => { S.guides = $('guides').checked; save(); draw(); };

  document.addEventListener('keydown', e => {
    if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
    if (e.key === '/') { e.preventDefault(); $('q').focus(); return; }
    if (e.key === 'a' || e.key === 'A') { S.on = !S.on; commit(); return; }
    const n = +e.key, views = SS.VIEWS[S.role];
    if (n >= 1 && n <= views.length) setView(views[n - 1].key);
  });

  $('room').value = S.room;
  $('room').addEventListener('change', () => { S.room = $('room').value.trim() || DEF.room; $('room').value = S.room; commit(); });
  const outUrl = () => new URL('display.html', location.href.split('#')[0].split('?')[0]).href + '?room=' + encodeURIComponent(S.room) + (params.get('hub') ? '&hub=' + encodeURIComponent(HUB) : '');
  $('copyUrl').onclick = async () => {
    try { await navigator.clipboard.writeText(outUrl()); $('copyUrl').textContent = 'Copied!'; }
    catch { prompt('OBS Browser Source URL (1920×1080):', outUrl()); }
    setTimeout(() => $('copyUrl').textContent = 'Copy OBS URL', 1400);
  };
  $('openOut').onclick = () => window.open(outUrl(), 'ss-out', 'width=960,height=540');

  // ── boot ──
  draw();
  SS.load(msg => { $('loading').textContent = msg || 'LOADING…'; }).then(async () => {
    L0 = await lg().catch(() => null);
    $('loading').style.display = 'none';
    drawList();
    commit();
  });
})();
</script>
</body>
</html>
